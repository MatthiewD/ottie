[workspace]
resolver = "3"
members = ["app", "crates/api", "crates/core", "crates/ottie"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/MatthiewD/ottie"
publish = false

[workspace.lints.clippy]
# No unwrap()/expect() outside tests (see clippy.toml for the test exemption).
unwrap_used = "warn"
expect_used = "warn"
