[package]
name = "ottie-api"
version = "0.1.0"
description = "HTTP API (REST + WebSocket events) of the Ottie download manager"
keywords = ["download-manager", "api", "websocket"]
categories = ["network-programming", "web-programming::http-server"]
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
# The built UI (ui-dist/) isn't in git but belongs in the published crate.
include = ["Cargo.toml", "src/**/*", "tests/**/*", "ui-dist/**/*"]

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
# The daemon proves it knows this computer's token without receiving it
# (POST /identity, docs/decisions/0058). The RustCrypto HMAC that goes with
# sha2, already in the lockfile.
hmac = "0.13.0"
mime_guess = "2.0.5"
ottie-core = { path = "../core", version = "0.1.0" }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Device tokens are kept as SHA-256 hashes (docs/decisions/0052).
sha2 = "0.11.1"
tokio = { version = "1.53.2", features = ["fs", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
ts-rs = "12.0.1"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = "0.30.0"
