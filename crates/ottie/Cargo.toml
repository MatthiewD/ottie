[package]
name = "ottie"
version = "0.1.1"
description = "Ottie, a cross-platform download manager: pause/resume, multi-connection downloads, speed limits (early development)"
readme = "../../README.md"
keywords = ["download-manager", "downloader", "http", "resume", "cli"]
categories = ["command-line-utilities", "network-programming"]
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
getrandom = "0.4.3"
open = "5.4.4"
ottie-api = { path = "../api", version = "0.1.1" }
ottie-core = { path = "../core", version = "0.1.1" }
# `ottie device`: a client of the running daemon's API (already built for the
# engine's downloads).
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
# The browser extension's native messaging host (already built for the API).
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# `ottie service install --system`: a real Windows service (installing it, and
# answering the Service Control Manager when it runs as one).
windows-service = "0.8.1"
# Letting go of the console window when Task Scheduler starts `ottie serve`.
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["time"] }
