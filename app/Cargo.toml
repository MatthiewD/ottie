[package]
name = "ottie-app"
version = "0.1.0"
description = "Ottie's desktop app: a window on the daemon's web UI"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
anyhow = "1.0.104"
# Clipboard monitoring (docs/decisions/0043): text only, no image support.
arboard = { version = "3.7.0", default-features = false }
futures-util = "0.3.34"
# Whether what answers on Ottie's port is this computer's Ottie, before its
# token goes there (docs/decisions/0058): the RustCrypto HMAC-SHA256 and
# random nonces, as the daemon uses them; all three already in the lockfile.
getrandom = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.1"
open = "5.4.4"
# Ottie's own notification sounds (docs/decisions/0038): Vorbis and WAV only.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "vorbis", "wav"] }
# Ottie on other computers (docs/decisions/0053): their tokens in the system's
# keychain (Credential Manager, Keychain, Secret Service over D-Bus in pure Rust).
keyring = "4.2.0"
# HTTPS for another computer's Ottie (behind Tailscale or a proxy), with the
# system's certificates, as the engine does.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-notification = "2.6.0"
# Show in folder (docs/decisions/0045): the file selected in the system's file
# manager on Windows, macOS and Linux (D-Bus in pure Rust), used from Rust only.
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.3"
tokio = { version = "1.53.2", features = ["io-util", "macros", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
auto-launch = "0.6"

[target.'cfg(windows)'.dependencies]
# The taskbar's theme, for the tray icon's colour.
windows-registry = "0.6.1"
# Sleep, hibernate and shut down when everything has finished
# (docs/decisions/0040): the system's calls, already built for Tauri.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    # The clipboard's change counter and password managers' marks (0043).
    "Win32_System_DataExchange",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland's clipboard for apps without a window in front (wlr data-control:
# KDE, Sway, Hyprland…); X11 and XWayland otherwise.
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
